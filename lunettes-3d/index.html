<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Essayage de lunettes</title>
  <style>
    body { margin:0; background:#111; color:#fff; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; }
    #wrap { position:relative; width:640px; height:480px; margin-top:20px; max-width:100%; }
    video, canvas { position:absolute; top:0; left:0; width:100%; height:100%; transform:scaleX(-1); }
    #menu { margin-top:16px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
    button { padding:10px 16px; border:0; border-radius:8px; background:#333; color:#fff; cursor:pointer; font-size:15px; }
    button.actif { background:#e63946; }
    #taille { margin-top:14px; }
  </style>
</head>
<body>
  <h1>Essayage de lunettes</h1>
  <div id="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" width="640" height="480"></canvas>
  </div>
  <div id="menu"></div>
  <label id="taille">Taille :
    <input type="range" id="size" min="1.2" max="2.4" step="0.05" value="1.6" />
  </label>
  <p id="status">Chargement...</p>
  <script>setTimeout(()=>{const s=document.getElementById("status");if(s.textContent==="Chargement...")s.textContent="Toujours bloqué : ouvre bien http://localhost:5173 (npm run dev) et regarde la console (Cmd+Option+C)."},10000)</script>
  <script type="module" src="/main.js"></script>
</body>
</html>
